{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">Your account</p><h1>Profile</h1></div></div><div class="card profile-card"><div class="avatar">{{current_user.name[:1]|upper}}</div><div><h2>{{current_user.name}}</h2><p class="muted">{{current_user.email}} · Joined {{current_user.joined_at.strftime('%d %b %Y')}}</p></div><form method="post" class="form-grid profile-form"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" value="{{current_user.name}}" required maxlength="80"></label><label>Department<input name="department" value="{{current_user.department}}" maxlength="100"></label><label>Year<input name="year" value="{{current_user.year}}" maxlength="20"></label><button class="btn primary">Save profile</button></form></div>{% endblock %}
